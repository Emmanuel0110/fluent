<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="advTitle" style="--main:#5bc0de; --accent:#ffffff;">
  <title id="advTitle">Advanced</title>
  <rect width="64" height="64" rx="12" fill="none"/>
  <rect x="4" y="4" width="56" height="56" rx="10" fill="var(--main)" opacity="0.12"/>
  <!-- medal circle -->
  <circle cx="32" cy="26" r="12" fill="var(--main)" stroke="var(--main)" stroke-width="0"/>
  <circle cx="32" cy="26" r="10" fill="none" stroke="var(--main)" stroke-width="2.5"/>
  <!-- laurel -->
  <path d="M18 26 c4 -8, 12 -8, 14 -1" fill="none" stroke="var(--main)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M46 26 c-4 -8, -12 -8, -14 -1" fill="none" stroke="var(--main)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- ribbon -->
