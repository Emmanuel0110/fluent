# Tests gate the deploy: `deploy` needs `test`, so a red suite never reaches the
# server. Before this, the workflow only deployed — the two test suites existed
# but guarded nothing.
name: Node.js CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            fluent-backend/package-lock.json
            fluent-frontend/package-lock.json

      - name: Install backend
        working-directory: fluent-backend
        run: npm ci

      - name: Install frontend
        working-directory: fluent-frontend
        run: npm ci

      - name: Backend tests
        working-directory: fluent-backend
        run: npm test

      - name: Frontend tests
        working-directory: fluent-frontend
        run: npm test

      # A compile check, not a deployable artifact: no .env is committed, so
      # VITE_API_URL is undefined here. The server builds its own bundle with the
      # real values. The point is to fail here rather than half-way through a
      # deploy, where the build runs after the code has already been pulled.
      - name: Frontend build
        working-directory: fluent-frontend
        run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          # Without this the script runs to the end whatever fails, and the job's
          # status is only the last command's. A failed `npm run build` would then
          # let `rsync --delete` publish the previous build and pm2 reload on top
          # of it: a silent stale deploy, reported green.
          script_stop: true
          script: |
            cd /home/manu/apps/fluent
            git pull origin main
            git status
            cd fluent-frontend
            npm install
            npm run build
            rsync -a --delete dist/ ../fluent-backend/public/
            cd ../fluent-backend/
            npm install --only=prod
            pm2 reload ecosystem.config.cjs
